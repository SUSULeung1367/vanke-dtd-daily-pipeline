[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanke-dtd-daily-pipeline"
version = "0.1.0"
description = "A reviewable daily Vanke Distance-to-Default pipeline demonstration"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2.1,<3",
  "scipy>=1.15,<2",
  "openpyxl>=3.1,<4",
  "requests>=2.32,<3",
  "yfinance>=1.2,<2",
  "jupyter>=1.1,<2",
  "nbconvert>=7.16,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=runtime/pytest_tmp"

[tool.setuptools.packages.find]
where = ["src"]
